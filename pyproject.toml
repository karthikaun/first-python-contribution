[project]
name = "first-python-contribution"
version = "0.1.0"
description = "Tooling for the First Python Contribution course"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["first-commits"]

[tool.ruff.lint.isort]
known-first-party = ["greetings", "splitbill", "textkit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "practice", "bug-hunt"]
pythonpath = ["practice", "bug-hunt"]
addopts = ["--import-mode=importlib"]
