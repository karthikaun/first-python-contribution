name: CI

on:
  push:
    branches: [main]
  pull_request:
    # First-commit PRs are checked by first-commit.yml. Skipping them here
    # avoids a stuck "waiting for approval" CI run on every learner's PR.
    paths-ignore: ["first-commits/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python tools/check_lessons.py
      - run: uv run pytest
