name: Exercise 2 tests

# Runs the learner's code with a read-only token and no secrets.
# exercise-2-merge.yml reads the result and decides whether to merge.

on:
  pull_request:
    paths: ["practice/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pytest and ruff
        run: python -m pip install pytest ruff
      - name: ruff format --check practice
        run: ruff format --check practice
      - name: ruff check practice
        run: ruff check practice
      - name: python -m pytest practice
        run: python -m pytest practice -v
