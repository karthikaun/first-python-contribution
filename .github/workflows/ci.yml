name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Learner PRs (first-commits/, practice/) have their own workflows.
    # Skipping them here keeps one clear check per learner PR.
    paths-ignore: ["first-commits/**", "graduates/**", "practice/greetings/**", "practice/tests/test_*.py"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python tools/check_lessons.py
      - run: uv run pytest
      - name: Run the commands shown in lessons
        run: uv run python tools/test_commands.py

  windows:
    # Windows learners use Git Bash (Lesson 03), so the lesson commands run
    # in Git Bash here too: the same shell, Python and git setup they have.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run pytest
      - name: Run the commands shown in lessons
        run: uv run python tools/test_commands.py
