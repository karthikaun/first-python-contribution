name: Update graduates wall

# Regenerates graduates/README.md whenever a graduate file lands on main.
# The files were validated before merging and are only parsed, never run.

on:
  push:
    branches: [main]
    paths: ["graduates/*.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graduates-wall

jobs:
  wall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/graduates_wall.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "Wall already up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update graduates wall"
          git push
