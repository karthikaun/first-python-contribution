name: Validate first commit

# pull_request_target runs this workflow from the base branch with a write
# token, so a fork's PR can be commented on and merged. To stay safe, the PR's
# code is never checked out or executed: the validator comes from the base
# branch and only reads the learner's file with git show + ast.parse.
# PRs that don't touch first-commits/<name>.py (status 3) get no comment.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ["first-commits/**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: first-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out base branch (trusted code only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch PR commits without checking them out
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/${PR}/head"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        id: check
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          python tools/check_first_commit.py --login "$LOGIN" --base "$BASE" --head "$HEAD" > comment.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat comment.md

      - name: Comment on the PR
        if: steps.check.outputs.status != '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Congratulate from the maintainer's account
        # Posts .github/congrats/first-commit.md as an approving review from the
        # MAINTAINER_TOKEN owner. Optional: skipped without the secret, and a
        # failure here never blocks the merge.
        if: steps.check.outputs.status == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MAINTAINER_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No MAINTAINER_TOKEN secret; skipping."; exit 0; fi
          python3 -c 'import os, sys; sys.stdout.write(open(sys.argv[1]).read().replace("{login}", os.environ["LOGIN"]))' \
            .github/congrats/first-commit.md > congrats.md
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve --body-file congrats.md

      - name: Merge
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD"

      - name: Fail the check when the file needs fixes
        if: steps.check.outputs.status != '0' && steps.check.outputs.status != '3'
        run: exit 1
