name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Learner PRs (first-commits/, practice/) have their own workflows.
    # Skipping them here keeps one clear check per learner PR.
    paths-ignore: ["first-commits/**", "practice/greetings/**", "practice/tests/test_*.py"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python tools/check_lessons.py
      - run: uv run pytest
