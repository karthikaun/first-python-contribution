name: Check bug report

# Checks bug-hunt issues (Lesson 09), opened with the "Bug hunt" issue form.
# The issue text is untrusted: it reaches the checker only through
# environment variables, is never passed to a shell, and the checker gives
# only the command's arguments to bug-hunt/splitbill.py. The bot posts one
# comment and updates it when the learner edits the issue. A maintainer
# reviews the report.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: bug-report-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'bug-hunt')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check the report
        id: check
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          set +e
          python tools/check_bug_report.py > comment.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat comment.md

      - name: Comment on the issue
        if: steps.check.outputs.status != '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- bug-hunt-check -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
