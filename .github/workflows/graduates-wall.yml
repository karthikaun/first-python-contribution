name: Update graduates wall

# Regenerates graduates/README.md whenever a graduate file lands on main.
# The files were validated before merging and are only parsed, never run.
#
# The graduate bot merges with GITHUB_TOKEN, and GitHub doesn't start new
# workflows from pushes made with that token, so the push trigger alone would
# miss every bot merge. workflow_run fires after "Validate graduate" finishes.

on:
  push:
    branches: [main]
    paths: ["graduates/*.py"]
  workflow_run:
    workflows: ["Validate graduate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graduates-wall

jobs:
  wall:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/graduates_wall.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "Wall already up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update graduates wall"
          git push
